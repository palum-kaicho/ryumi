<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罰ゲームルーレット</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    overflow-x:hidden;
}

.container{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:40px;
    padding:30px;
    flex-wrap:wrap;
}

.left{
    text-align:center;
}

h1{
    color:#ff9db6;
}

.wheel-wrap{
    position:relative;
    width:420px;
    height:420px;
}

.pointer{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:40px solid #ff4d6d;
    z-index:10;
    filter:drop-shadow(0 0 8px rgba(255,80,120,0.7));
}

canvas{
    background:#222;
    border-radius:50%;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

button{
    margin-top:20px;
    padding:15px 40px;
    border:none;
    border-radius:999px;
    background:#ff4d6d;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    font-size:28px;
    color:#ffd6e0;
    font-weight:bold;
    min-height:40px;
}

.result.win{
    animation: pop 0.5s ease;
}

@keyframes pop{

    0%{
        transform:scale(0.8);
        opacity:0;
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.right{
    width:320px;
}

.character{
    width:100%;
    border-radius:20px;
    margin-bottom:20px;
}

.reward-box{
    background:#1d1d1d;
    padding:20px;
    border-radius:20px;
}

.reward-box h2{
    margin-top:0;
    text-align:center;
    color:#ffb6c9;
}

.reward{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.reward:last-child{
    border-bottom:none;
}

.coin{
    color:#ffd54f;
    font-weight:bold;
}

.flash{
    animation: flashBg 0.6s ease;
}

@keyframes flashBg{

    0%{
        background:#111;
    }

    50%{
        background:#2a0010;
    }

    100%{
        background:#111;
    }
}

.shake{
    animation: shake 0.4s;
}

@keyframes shake{

    0%{ transform:translate(0px,0px); }
    20%{ transform:translate(-5px,3px); }
    40%{ transform:translate(5px,-3px); }
    60%{ transform:translate(-4px,2px); }
    80%{ transform:translate(4px,-2px); }
    100%{ transform:translate(0px,0px); }

}

.particle{
    position:fixed;
    width:10px;
    height:10px;
    border-radius:50%;
    pointer-events:none;
    animation: particle 1s linear forwards;
    z-index:9999;
}

@keyframes particle{

    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    100%{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:0;
    }

}

.jackpot{
    animation: jackpotFlash 1s infinite;
}

@keyframes jackpotFlash{

    0%{
        background:#111;
    }

    25%{
        background:#330000;
    }

    50%{
        background:#111133;
    }

    75%{
        background:#003300;
    }

    100%{
        background:#111;
    }

}

.big-result{

    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:72px;
    font-weight:bold;
    color:#fff;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff00ff,
        0 0 40px #00ffff;

    z-index:99999;

    animation: bigPop 1s ease;

    pointer-events:none;
}

@keyframes bigPop{

    0%{
        transform:translate(-50%,-50%) scale(0.3);
        opacity:0;
    }

    50%{
        transform:translate(-50%,-50%) scale(1.3);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="left">

        <h1>罰ゲームルーレット</h1>

        <div class="wheel-wrap">

            <div class="pointer"></div>

            <canvas id="wheel" width="420" height="420"></canvas>

        </div>

        <button onclick="spin()">回す</button>

        <div class="result" id="result"></div>

    </div>

    <div class="right">

        <img src="./ryumi.PNG" class="character">

        <div class="reward-box">

            <h2>コイン一覧</h2>

            <div class="reward">
                <span>水</span>
                <span class="coin">10</span>
            </div>

            <div class="reward">
                <span>はちみつ</span>
                <span class="coin">20</span>
            </div>

            <div class="reward">
                <span>アイス</span>
                <span class="coin">30</span>
            </div>

            <div class="reward">
                <span>七味（1振り）</span>
                <span class="coin">100</span>
            </div>

            <div class="reward">
                <span>七味（10振り）</span>
                <span class="coin">500</span>
            </div>

            <div class="reward">
                <span>コチュジャン</span>
                <span class="coin">300</span>
            </div>

            <div class="reward">
                <span>マヨネーズ</span>
                <span class="coin">800</span>
            </div>

        </div>

    </div>

</div>

<audio id="spinSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=roulette-1-26337.mp3">
</audio>

<audio id="winSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8631d8a9f.mp3?filename=success-fanfare-trumpets-6185.mp3">
</audio>

<audio id="tickSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_5d0c12c6d1.mp3?filename=click-124467.mp3">
</audio>

<audio id="jackpotSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/11/17/audio_8828f20d31.mp3?filename=success-1-6297.mp3">
</audio>

<script>

const items = [
    "水",
    "はちみつ",
    "アイス",
    "七味×1",
    "七味×10",
    "コチュジャン",
    "マヨネーズ"
];

const colors = [
    "#60a5fa",
    "#fbbf24",
    "#a78bfa",
    "#ef4444",
    "rainbow",
    "#dc2626",
    "rainbow"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const size = 420;
const center = size / 2;
const radius = 200;

let rotation = 0;
let spinning = false;
let lastTick = 0;

function drawWheel(angle){

    const arc = Math.PI * 2 / items.length;

    ctx.clearRect(0,0,size,size);

    for(let i=0;i<items.length;i++){

        const start = i * arc + angle;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();

        if(colors[i] === "rainbow"){

            const gradient = ctx.createLinearGradient(0,0,400,400);

            gradient.addColorStop(0,"#ff0000");
            gradient.addColorStop(0.2,"#ffff00");
            gradient.addColorStop(0.4,"#00ff00");
            gradient.addColorStop(0.6,"#00ffff");
            gradient.addColorStop(0.8,"#0000ff");
            gradient.addColorStop(1,"#ff00ff");

            ctx.fillStyle = gradient;

        }else{

            ctx.fillStyle = colors[i];

        }

        ctx.fill();

        ctx.save();

        ctx.translate(center, center);
        ctx.rotate(start + arc / 2);

        ctx.fillStyle = i === 6 ? "#111" : "#fff";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "right";

        ctx.fillText(items[i], radius - 20, 10);

        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(center, center, 35, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();
}

drawWheel(0);

function createParticles(){

    for(let i = 0; i < 40; i++){

        const particle = document.createElement("div");

        particle.className = "particle";

        particle.style.left = (window.innerWidth / 2) + "px";
        particle.style.top = (window.innerHeight / 2) + "px";

        particle.style.background =
            "hsl(" + Math.random() * 360 + "deg 100% 70%)";

        particle.style.setProperty(
            "--x",
            (Math.random() * 600 - 300) + "px"
        );

        particle.style.setProperty(
            "--y",
            (Math.random() * 600 - 300) + "px"
        );

        document.body.appendChild(particle);

        setTimeout(function(){

            particle.remove();

        },1000);
    }
}

function spin(){

    if(spinning){
        return;
    }

    spinning = true;

    document.getElementById("spinSound").play();

    const extra = 360 * 5;
    const random = Math.random() * 360;

    const target = rotation + extra + random;

    const start = rotation;

    const duration = 5000;
    const startTime = performance.now();

    function animate(now){

        const elapsed = now - startTime;

        const progress = Math.min(elapsed / duration, 1);

        const eased = 1 - Math.pow(1 - progress, 3);

        const current = start + (target - start) * eased;

        drawWheel(current * Math.PI / 180);

        if(now - lastTick > 80){

            const tick = document.getElementById("tickSound");

            tick.currentTime = 0;

            tick.play();

            lastTick = now;

        }

        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            rotation = target % 360;

            const slice = 360 / items.length;

            const adjusted = (360 - rotation + slice / 2) % 360;

            const index = Math.floor(adjusted / slice);

            const resultText = document.getElementById("result");

            resultText.innerText =
                "結果：" + items[index];

            resultText.classList.remove("win");

            void resultText.offsetWidth;

            resultText.classList.add("win");

            document.body.classList.remove("flash");

            void document.body.offsetWidth;

            document.body.classList.add("flash");

            document.body.classList.remove("shake");

            void document.body.offsetWidth;

            document.body.classList.add("shake");

            document.getElementById("winSound").play();

            createParticles();

            if(
                items[index] === "七味×10" ||
                items[index] === "マヨネーズ"
            ){

                document.body.classList.add("jackpot");

                document.getElementById("jackpotSound").play();

                const big = document.createElement("div");

                big.className = "big-result";

                big.innerText = "🎉 大当たり 🎉";

                document.body.appendChild(big);

                setTimeout(function(){

                    big.remove();

                    document.body.classList.remove("jackpot");

                },3000);

            }

            spinning = false;
        }
    }

    requestAnimationFrame(animate);
}

</script>

</body>
</html>
