<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信ルーレット</title>
<style>
*{box-sizing:border-box;}
body{margin:0;background:#111;color:white;font-family:sans-serif;overflow-x:hidden;overflow-y:auto;}
.container{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:40px 20px;flex-wrap:wrap;}
.left{flex:1 1 420px;max-width:480px;text-align:center;}
.right{flex:1 1 340px;max-width:380px;}
.mode-buttons{display:flex;justify-content:center;gap:10px;margin-bottom:30px;}
.mode-buttons button{padding:12px 24px;border:none;border-radius:999px;color:white;font-size:18px;cursor:pointer;transition:0.2s;}
.normal-btn{background:#3b82f6;}
.special-btn{background:#ef4444;}
.vip-btn{background:linear-gradient(135deg,#ffcc00,#ff0080);}
.active{transform:scale(1.05);box-shadow:0 0 20px rgba(255,255,255,0.5),0 0 40px rgba(255,255,255,0.2);}
.wheel-wrap{position:relative;width:420px;height:420px;margin:0 auto;}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:40px solid #fff;z-index:10;}
canvas{background:#222;border-radius:50%;box-shadow:0 0 25px rgba(255,255,255,0.15);}
.spin-btn{margin-top:30px;padding:16px 50px;border:none;border-radius:999px;background:#ff4d6d;color:white;font-size:24px;cursor:pointer;transition:0.2s;}
.spin-btn:hover{transform:scale(1.05);}
.result{margin-top:20px;font-size:34px;font-weight:bold;min-height:50px;}
.character{width:100%;border-radius:20px;margin-bottom:20px;}
.panel{background:#1d1d1d;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 0 20px rgba(255,255,255,0.05);}
.panel h2{margin-top:0;text-align:center;}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.row:last-child{border-bottom:none;}
.percent{color:#ffd54f;font-weight:bold;}
.rainbow{background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,magenta);background-size:400% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowMove 2s linear infinite;}
@keyframes rainbowMove{0%{background-position:0%;}100%{background-position:400%;}}
.particle{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:particle 1s linear forwards;z-index:99999;}
@keyframes particle{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--x), var(--y)) scale(0);opacity:0;}}
.flash{animation:flash 0.5s;}
@keyframes flash{0%{background:#111;}50%{background:#300;}100%{background:#111;}}
.shake{animation:shake 0.4s;}
@keyframes shake{0%{transform:translate(0px,0px);}25%{transform:translate(-5px,4px);}50%{transform:translate(5px,-4px);}75%{transform:translate(-4px,2px);}100%{transform:translate(0px,0px);}}
.big-result{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:82px;font-weight:bold;z-index:999999;animation:pop 1s ease;text-shadow:0 0 10px #fff,0 0 20px #ff00ff,0 0 40px #00ffff,0 0 80px #ffff00;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0.3);opacity:0;}50%{transform:translate(-50%,-50%) scale(1.3);}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.cutin{position:fixed;inset:0;z-index:999999;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:0.2s;}
.cutin.show{opacity:1;}
.cutin-flash{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,0,100,0.95),rgba(0,0,0,0.95));animation:cutinFlash 0.25s infinite alternate;}
@keyframes cutinFlash{0%{opacity:0.7;}100%{opacity:1;}}
.cutin-image{position:relative;width:420px;border-radius:30px;z-index:2;animation:cutinZoom 0.4s infinite alternate;box-shadow:0 0 30px #ff0080,0 0 80px #ff0080;}
@keyframes cutinZoom{0%{transform:scale(1);}100%{transform:scale(1.08);}}
.gekiatsu{position:absolute;top:8%;z-index:5;font-size:120px;font-weight:bold;color:#ff0000;text-shadow:0 0 10px #fff,0 0 20px #ff0000,0 0 40px #ff6600,0 0 80px #ffff00;animation:gekiatsuFlash 0.15s infinite alternate, cutinZoom 0.3s infinite alternate;}
@keyframes gekiatsuFlash{0%{opacity:0.7;}100%{opacity:1;}}
.reset-btn{width:100%;background:#444;}
.vip-mode{

    animation:vipBg 2s linear infinite;

    background:
        linear-gradient(
            135deg,
            #220022,
            #000,
            #001133
        );
}

@keyframes vipBg{

    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }
}
@media (max-width: 900px){.container{flex-direction:column;align-items:center;}.left,.right{max-width:90%;}}
</style>
</head>
<body>
<div class="cutin" id="cutin">
  <div class="cutin-flash"></div>
  <div class="gekiatsu">激 熱</div>
  <img src="./ryumi.PNG" class="cutin-image">
</div>
<div class="container">
<div class="right">
  <div class="panel">
    <h2 id="infoTitle">通常ルーレット確率</h2>
    <div id="probabilityList"></div>
  </div>
  <div class="panel">
    <h2>当選カウンター</h2>
    <div id="counterList"></div>
  </div>
  <div class="panel">
    <button class="spin-btn reset-btn" onclick="resetCounters()">カウンターリセット</button>
  </div>
</div>

<div class="left">
  <div class="mode-buttons">
    <button class="normal-btn active" id="normalBtn" onclick="setMode('normal')">通常ルーレット</button>
    <button class="special-btn" id="specialBtn" onclick="setMode('special')">スペシャルルーレット</button>
    <button class="vip-btn" id="vipBtn" onclick="setMode('vip')">VIPルーレット</button>
  </div>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="420" height="420"></canvas>
  </div>
  <button class="spin-btn" onclick="spin()">回す</button>

  <!-- 結果表示 -->
  <div class="result" id="result"></div>

  <!-- ミニキャラをここに追加 -->
  <img src="./ryumi.PNG" class="character" id="miniCharacter">
</div>
<script>

const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function beep(freq,duration,type="sine",volume=0.03){

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = type;

    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(audioCtx.currentTime + duration);
}

function playTick(){
    beep(1200,0.02,"square",0.02);
}

function playSpin(){
    beep(220,1,"sawtooth",0.03);
}

function playWin(){

    beep(700,0.15,"triangle",0.04);

    setTimeout(()=>{
        beep(1000,0.2,"triangle",0.04);
    },100);
}

function playJackpot(){

    const melody = [

        {freq:523,time:0},
        {freq:659,time:120},
        {freq:784,time:240},
        {freq:1046,time:360},
        {freq:1318,time:520},
        {freq:1568,time:680},

    ];

    melody.forEach(note=>{

        setTimeout(()=>{

            const osc =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc.type = "sawtooth";

            osc.frequency.value =
                note.freq;

            gain.gain.value = 0.05;

            osc.connect(gain);

            gain.connect(audioCtx.destination);

            osc.start();

            osc.stop(
                audioCtx.currentTime + 0.25
            );

        },note.time);

    });
}

const normalData = [
    {label:"水", chance:35},
    {label:"アイス", chance:15},
    {label:"はちみつ", chance:10},
    {label:"七味（1振り）", chance:10},
    {label:"マヨネーズ", chance:10},
    {label:"コチュジャン", chance:10},
    {label:"七味（10振り）", chance:10}
];

const specialData = [
    {label:"水", chance:10},
    {label:"アイス", chance:10},
    {label:"はちみつ", chance:10},
    {label:"七味（1振り）", chance:10},
    {label:"マヨネーズ", chance:10},
    {label:"コチュジャン", chance:10},
    {label:"七味（10振り）", chance:17.5},
    {label:"全部乗せ", chance:17.5}
];

const vipData = [
    {label:"水", chance:10},
    {label:"七味（10振り）", chance:40},
    {label:"全部乗せ", chance:50}
];

const counters =
    JSON.parse(
        localStorage.getItem(
            "rouletteCounters"
        )
    ) || {

        "水":0,
        "はちみつ":0,
        "アイス":0,
        "七味（1振り）":0,
        "七味（10振り）":0,
        "コチュジャン":0,
        "マヨネーズ":0,
        "全部乗せ":0
    };

let totalSpins =
    Number(
        localStorage.getItem(
            "totalSpins"
        )
    ) || 0;

const colors = [
    "#60a5fa",
    "#a78bfa",
    "#fbbf24",
    "#ef4444",
    "#22c55e",
    "#f97316",
    "#9333ea",
    "#ff0080"
];

let mode = "normal";

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const size = 420;

const center = size / 2;

const radius = 200;

let rotation = 0;

let spinning = false;

function saveData(){

    localStorage.setItem(
        "rouletteCounters",
        JSON.stringify(counters)
    );

    localStorage.setItem(
        "totalSpins",
        totalSpins
    );
}

function resetCounters(){

    if(spinning){
        return;
    }

    if(!confirm("カウンターをリセットしますか？")){
        return;
    }

    counters["水"]=0;
    counters["はちみつ"]=0;
    counters["アイス"]=0;
    counters["七味（1振り）"]=0;
    counters["七味（10振り）"]=0;
    counters["コチュジャン"]=0;
    counters["マヨネーズ"]=0;
    counters["全部乗せ"]=0;

    totalSpins=0;

    saveData();

    updateStats();
}

function updateStats(){

    const counterList =
        document.getElementById(
            "counterList"
        );

    counterList.innerHTML = `

        <div class="row">
            <span>総回転数</span>
            <span>${totalSpins}</span>
        </div>

        <div class="row">
            <span>水</span>
            <span>${counters["水"]}</span>
        </div>

        <div class="row">
            <span>はちみつ</span>
            <span>${counters["はちみつ"]}</span>
        </div>

        <div class="row">
            <span>アイス</span>
            <span>${counters["アイス"]}</span>
        </div>

        <div class="row">
            <span>七味（1振り）</span>
            <span>${counters["七味（1振り）"]}</span>
        </div>

        <div class="row">
            <span>七味（10振り）</span>
            <span>${counters["七味（10振り）"]}</span>
        </div>

        <div class="row">
            <span>コチュジャン</span>
            <span>${counters["コチュジャン"]}</span>
        </div>

        <div class="row">
            <span>マヨネーズ</span>
            <span>${counters["マヨネーズ"]}</span>
        </div>

        <div class="row rainbow">
            <span>全部乗せ</span>
            <span>${counters["全部乗せ"]}</span>
        </div>
    `;
}

function getCurrentData(){

    if(mode === "normal"){
        return normalData;
    }

    if(mode === "special"){
        return specialData;
    }

    return vipData;
}

function updateProbabilityList(){

    const list =
        document.getElementById(
            "probabilityList"
        );

    const title =
        document.getElementById(
            "infoTitle"
        );

    title.innerText =
        mode === "normal"
        ? "通常ルーレット確率"
        : mode === "special"
        ? "スペシャルルーレット確率"
        : "VIPルーレット確率";

    list.innerHTML = "";

    getCurrentData().forEach(item=>{

        list.innerHTML += `
            <div class="row">
                <span>${item.label}</span>
                <span class="percent">
                    ${item.chance}%
                </span>
            </div>
        `;
    });
}

function setMode(newMode){

    if(spinning){
        return;
    }

    mode = newMode;

    document
        .querySelectorAll(
            ".mode-buttons button"
        )
        .forEach(btn=>
            btn.classList.remove("active")
        );

    document
        .getElementById(
            newMode === "normal"
            ? "normalBtn"
            : newMode === "special"
            ? "specialBtn"
            : "vipBtn"
        )
        .classList
        .add("active");

    drawWheel(rotation * Math.PI / 180);

    updateProbabilityList();
    if(mode === "vip"){

    document.body.classList.add("vip-mode");

}else{

    document.body.classList.remove("vip-mode");
}
}

function weightedRandom(data){

    const total =
        data.reduce(
            (sum,item)=>
                sum + item.chance,
            0
        );

    let random =
        Math.random() * total;

    for(let item of data){

        if(random < item.chance){
            return item.label;
        }

        random -= item.chance;
    }
}

function drawWheel(angle){

    const data =
        getCurrentData();

    const arc =
        Math.PI * 2 / data.length;

    ctx.clearRect(0,0,size,size);

    for(let i=0;i<data.length;i++){

        const start =
            i * arc + angle;

        const end =
            start + arc;

        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        if(
            data[i].label === "全部乗せ"
            ||
            data[i].label === "七味（10振り）"
        ){

            const gradient =
                ctx.createLinearGradient(
                    0,0,400,400
                );

            gradient.addColorStop(0,"#ff0000");
            gradient.addColorStop(0.2,"#ffff00");
            gradient.addColorStop(0.4,"#00ff00");
            gradient.addColorStop(0.6,"#00ffff");
            gradient.addColorStop(0.8,"#0000ff");
            gradient.addColorStop(1,"#ff00ff");

            ctx.fillStyle = gradient;

        }else{

            ctx.fillStyle =
                colors[i % colors.length];
        }

        ctx.fill();

        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(start + arc / 2);

        ctx.fillStyle = "#fff";

        ctx.font = "bold 18px sans-serif";

        ctx.textAlign = "right";

        ctx.fillText(
            data[i].label,
            radius - 20,
            10
        );

        ctx.restore();
    }

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        35,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#111";

    ctx.fill();
}

function createParticles(amount=70){

for(let i=0;i<amount;i++){
        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            (window.innerWidth/2)+"px";

        particle.style.top =
            (window.innerHeight/2)+"px";

        particle.style.background =
            `hsl(${Math.random()*360}deg 100% 70%)`;

        particle.style.setProperty(
            "--x",
            (Math.random()*700-350)+"px"
        );

        particle.style.setProperty(
            "--y",
            (Math.random()*700-350)+"px"
        );

        document.body.appendChild(
            particle
        );

        setTimeout(()=>{
            particle.remove();
        },1000);
    }
}

async function showCutin(){

    const cutin =
        document.getElementById(
            "cutin"
        );

    cutin.classList.add("show");

    beep(250,0.3,"sawtooth",0.06);

    setTimeout(()=>{
        beep(800,0.15,"triangle",0.05);
    },200);

    setTimeout(()=>{
        beep(1200,0.2,"triangle",0.06);
    },350);

    await new Promise(resolve=>
        setTimeout(resolve,1800)
    );

    cutin.classList.remove("show");
}

async function spin(){

    if(spinning){
        return;
    }

    spinning = true;

    audioCtx.resume();

if(mode === "normal"){

    beep(220,1,"sawtooth",0.03);

}else if(mode === "special"){

    beep(320,1.2,"sawtooth",0.05);

}else{

    beep(120,1.8,"square",0.08);

    document.body.classList.add("flash");
}
    const data =
        getCurrentData();

    const result =
        weightedRandom(data);

    const index =
        data.findIndex(
            item =>
                item.label === result
        );

    const isJackpot =
        result === "七味（10振り）"
        ||
        result === "全部乗せ";

    const willCutin =
        isJackpot;

    const slice =
        360 / data.length;

    const targetAngle =
        270 - (
            index * slice +
            slice / 2
        );

    const extra =
        360 * 5;

    const target =
        rotation +
        extra +
        (
            (
                targetAngle -
                rotation % 360 +
                360
            ) % 360
        );

    const start =
        rotation;

const duration =
    mode === "normal"
    ? 4500
    : mode === "special"
    ? 5500
    : 7000;
    const startTime =
        performance.now();

    let lastTick = 0;

    let cutinPlayed = false;

    function animate(now){

        const elapsed =
            now - startTime;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );

        if(
            willCutin &&
            !cutinPlayed &&
            progress > 0.45
        ){

            cutinPlayed = true;

            showCutin();
        }

        const eased =
            1 - Math.pow(
                1 - progress,
                3
            );

        const current =
            start +
            (target - start) * eased;

        rotation = current;

        drawWheel(
            current * Math.PI / 180
        );

const tickSpeed =
    mode === "normal"
    ? 80
    : mode === "special"
    ? 55
    : 35;

if(now - lastTick > tickSpeed){
            playTick();

            lastTick = now;
        }

        if(progress < 1){

            requestAnimationFrame(
                animate
            );

        }else{

            totalSpins++;

            counters[result] =
                (counters[result] || 0) + 1;

            saveData();

            updateStats();

            document.getElementById(
                "result"
            ).innerText =
                "結果：" + result;

            document.body
                .classList
                .remove("flash");

            void document.body.offsetWidth;

            document.body
                .classList
                .add("flash");

            document.body
                .classList
                .remove("shake");

            void document.body.offsetWidth;

            document.body
                .classList
                .add("shake");

            playWin();

createParticles(
    mode === "normal"
    ? 70
    : mode === "special"
    ? 120
    : 220
);
            if(isJackpot){

                playJackpot();

                const big =
                    document.createElement(
                        "div"
                    );

                big.className =
                    "big-result rainbow";

if(mode === "vip"){

    big.innerText =
        result === "全部乗せ"
        ? "👑 VIP JACKPOT 👑"
        : "💥 VIP 激熱 💥";

}else if(mode === "special"){

    big.innerText =
        result === "全部乗せ"
        ? "🎉 全 部 乗 せ 🎉"
        : "🔥 SP 激熱 🔥";

}else{

    big.innerText =
        result === "全部乗せ"
        ? "🎉 全 部 乗 せ 🎉"
        : "🎉 大 当 た り 🎉";
}

                document.body.appendChild(
                    big
                );

                setTimeout(()=>{
                    big.remove();
                },3000);
            }

            spinning = false;
        }
    }

    requestAnimationFrame(
        animate
    );
}

updateProbabilityList();

updateStats();

drawWheel(0);

</script>

</body>
</html>
