<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罰ゲームルーレット</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#111;
    font-family:sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

.container{
    display:flex;
    gap:40px;
    align-items:center;
    flex-wrap:wrap;
    padding:30px;
}

.left-side{
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin-bottom:20px;
    font-size:32px;
    color:#ff9db6;
    text-shadow:0 0 10px rgba(255,100,150,0.4);
}

.roulette-wrapper{
    position:relative;
    width:420px;
    height:420px;
}

canvas{
    border-radius:50%;
    box-shadow:0 0 30px rgba(255,255,255,0.15);
    background:#222;
}

.pointer{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:40px solid #ff4d6d;
    z-index:10;
}

button{
    margin-top:30px;
    padding:14px 36px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#ff4d6d,#ff89a5);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 20px rgba(255,80,120,0.35);
}

button:hover{
    transform:scale(1.05);
}

.result{
    margin-top:25px;
    font-size:28px;
    font-weight:bold;
    min-height:40px;
    color:#ffd6e0;
}

.right-side{
    display:flex;
    flex-direction:column;
    gap:25px;
    align-items:center;
}

.character-box img{
    width:320px;
    border-radius:24px;
    box-shadow:0 0 30px rgba(255,255,255,0.12);
    border:3px solid rgba(255,255,255,0.08);
}

.reward-box{
    background:#1d1d1d;
    padding:25px;
    border-radius:20px;
    width:320px;
    box-shadow:0 0 20px rgba(255,255,255,0.08);
}

.reward-box h2{
    margin-top:0;
    margin-bottom:20px;
    text-align:center;
    font-size:28px;
    color:#ffb6c9;
}

.reward-item{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:20px;
}

.reward-item:last-child{
    border-bottom:none;
}

.coin{
    color:#ffd54f;
    font-weight:bold;
}

@media(max-width:1100px){

    .container{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="left-side">

        <h1>罰ゲームルーレット</h1>

        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <canvas id="wheel" width="420" height="420"></canvas>
        </div>

        <button onclick="spin()">回す</button>

        <div class="result" id="result"></div>

    </div>

    <div class="right-side">

        <div class="character-box">
            <img src="./ryumi.PNG" alt="character">
        </div>

        <div class="reward-box">

            <h2>コイン一覧</h2>

            <div class="reward-item">
                <span>水</span>
                <span class="coin">10 コイン</span>
            </div>

            <div class="reward-item">
                <span>はちみつ</span>
                <span class="coin">20 コイン</span>
            </div>

            <div class="reward-item">
                <span>アイス</span>
                <span class="coin">30 コイン</span>
            </div>

            <div class="reward-item">
                <span>七味（1振り）</span>
                <span class="coin">100 コイン</span>
            </div>

            <div class="reward-item">
                <span>七味（10振り）</span>
                <span class="coin">500 コイン</span>
            </div>

            <div class="reward-item">
                <span>コチュジャン</span>
                <span class="coin">300 コイン</span>
            </div>

            <div class="reward-item">
                <span>マヨネーズ</span>
                <span class="coin">800 コイン</span>
            </div>

        </div>

    </div>

</div>

<script>

const items = [
    "水",
    "はちみつ",
    "アイス",
    "七味×1",
    "七味×10",
    "コチュジャン",
    "マヨネーズ"
];

const colors = [
    "#60a5fa",
    "#fbbf24",
    "#a78bfa",
    "#ef4444",
    "#991b1b",
    "#dc2626",
    "#f3f4f6"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = 200;

let currentRotation = 0;
let spinning = false;

function drawWheel(rotation){

    const arc = (Math.PI * 2) / items.length;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let i = 0; i < items.length; i++){

        const startAngle = i * arc + rotation;
        const endAngle = startAngle + arc;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.save();

        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + arc / 2);

        ctx.textAlign = "right";
        ctx.fillStyle = i === 6 ? "#111" : "#fff";
        ctx.font = "bold 20px sans-serif";

        ctx.fillText(items[i], radius - 20, 10);

        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(centerX, centerY, 45, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();
}

drawWheel(0);

function spin(){

    if(spinning){
        return;
    }

    spinning = true;

    document.getElementById("result").innerText = "";

    const extraSpins = 5;
    const randomDeg = Math.random() * 360;
    const totalDeg = (360 * extraSpins) + randomDeg;

    const start = currentRotation;
    const end = currentRotation + totalDeg;

    const duration = 5000;
    const startTime = performance.now();

    function animate(now){

        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const easeOut = 1 - Math.pow(1 - progress, 3);

        const angle = start + (end - start) * easeOut;

        drawWheel(angle * Math.PI / 180);

        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            currentRotation = end % 360;

            const adjusted =
                (360 - currentRotation + ((360 / items.length) / 2)) % 360;

            const index =
                Math.floor(adjusted / (360 / items.length)) % items.length;

            document.getElementById("result").innerText =
                "結果：" + items[index];

            spinning = false;
        }
    }

    requestAnimationFrame(animate);
}

</script>

</body>
</html>
